name: Kafka Tests - All (Single Thread)

on:
  workflow_dispatch:
    inputs:
      thread_count:
        description: 'Number of parallel threads (IGNORED - always runs with 1 thread)'
        default: '1'
        type: choice
        options: ['1']
      enable_parallel:
        description: 'Enable parallel execution'
        default: 'false'
        type: choice
        options: ['false', 'true']
  schedule:
    - cron: '0 4 * * *' # Daily at 4 AM UTC - всегда запускается в 1 поток

jobs:
  test-all:
    runs-on: ubuntu-latest

    steps:
      # ─────────────────────────────────────────────
      # Checkout source code
      # ─────────────────────────────────────────────
      - uses: actions/checkout@v4

      # ─────────────────────────────────────────────
      # Setup Java
      # ─────────────────────────────────────────────
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      # ─────────────────────────────────────────────
      # Setup Kafka SSL certificates
      # ─────────────────────────────────────────────
      - name: Setup Kafka SSL certificates
        run: |
          mkdir -p $HOME/kafka_key
          echo "${{ secrets.KAFKA_TRUSTSTORE_BASE64 }}" | base64 -d > $HOME/kafka_key/kafka.truststore.jks
          echo "${{ secrets.KAFKA_KEYSTORE_BASE64 }}" | base64 -d > $HOME/kafka_key/kafka.keystore.p12
          echo "KAFKA_SSL_TRUSTSTORE_LOCATION=$HOME/kafka_key/kafka.truststore.jks" >> $GITHUB_ENV
          echo "KAFKA_SSL_KEYSTORE_LOCATION=$HOME/kafka_key/kafka.keystore.p12" >> $GITHUB_ENV
          echo "✓ Kafka SSL certificates configured"

      # ─────────────────────────────────────────────
      #    DEBUG: Check KAFKA_BOOTSTRAP_SERVERS
      # ─────────────────────────────────────────────
      - name:     Debug KAFKA_BOOTSTRAP_SERVERS
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "   CRITICAL DEBUG INFO"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          if [ -z "$KAFKA_BOOTSTRAP_SERVERS" ]; then
            echo "   KAFKA_BOOTSTRAP_SERVERS is EMPTY!"
            echo "Length: 0"
            echo ""
            echo "   CRITICAL ERROR: Cannot run tests without Kafka connection!"
            echo ""
            echo "Please check your GitHub Secrets configuration:"
            echo "  Settings → Secrets and variables → Actions → Secrets"
            echo "  Or if using environment:"
            echo "  Settings → Environments → [your-env] → Secrets"
            echo ""
            exit 1
          else
            echo "   KAFKA_BOOTSTRAP_SERVERS is SET"
            echo "Length: ${#KAFKA_BOOTSTRAP_SERVERS}"
            echo "First 30 chars: ${KAFKA_BOOTSTRAP_SERVERS:0:30}..."
            echo "Last 10 chars: ...${KAFKA_BOOTSTRAP_SERVERS: -10}"
          fi
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        env:
          KAFKA_BOOTSTRAP_SERVERS: ${{ secrets.KAFKA_BOOTSTRAP_SERVERS }}

      # ─────────────────────────────────────────────
      # Restore Allure history from gh-pages
      # ─────────────────────────────────────────────
      - name: Checkout gh-pages (Allure history)
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages
        continue-on-error: true

      - name: Backup Allure history to temp
        run: |
          mkdir -p /tmp/allure-history
          if [ -d gh-pages/history ]; then
            cp -r gh-pages/history/* /tmp/allure-history/
            echo "Backed up $(ls -1 /tmp/allure-history 2>/dev/null | wc -l) history files"
          else
            echo "No history found (first run or gh-pages branch doesn't exist)"
          fi

      # ─────────────────────────────────────────────
      # Create Allure environment.properties in TEMP
      # ─────────────────────────────────────────────
      - name: Create Allure environment info in temp
        run: |
          # ВСЕГДА запускаем в 1 поток для стабильности
          THREAD_COUNT=1
          
          # Определяем использовать ли parallel профиль
          if [ "${{ github.event.inputs.enable_parallel }}" = "true" ] && [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            USE_PARALLEL="true"
            PROFILE="parallel"
          else
            USE_PARALLEL="false"
            PROFILE="none"
          fi
          
          mkdir -p /tmp/allure-env
          cat > /tmp/allure-env/environment.properties << EOF
          Test.Type=Kafka Integration Tests
          Kafka.Broker=${{ secrets.KAFKA_BOOTSTRAP_SERVERS || 'kafka-xxxxx.aivencloud.com:12345' }}
          Threads=${THREAD_COUNT}
          Profile=${PROFILE}
          Parallel.Enabled=${USE_PARALLEL}
          Execution.Type=${{ github.event_name }}
          Environment=CI
          Platform=ubuntu-latest
          Java.Version=17
          Maven.Version=3.8+
          Framework=JUnit 5
          SSL.Enabled=true
          Workflow=${{ github.workflow }}
          Run.Number=${{ github.run_number }}
          Triggered.By=${{ github.actor }}
          Branch=${{ github.ref_name }}
          Commit=${{ github.sha }}
          Repository=${{ github.repository }}
          EOF
          
          # Сохраняем в переменные окружения для следующих шагов
          echo "TEST_THREAD_COUNT=${THREAD_COUNT}" >> $GITHUB_ENV
          echo "USE_PARALLEL_PROFILE=${USE_PARALLEL}" >> $GITHUB_ENV
          
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "   Test Configuration"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Thread count: ${THREAD_COUNT}"
          echo "Use parallel profile: ${USE_PARALLEL}"
          echo "Event type: ${{ github.event_name }}"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      # ─────────────────────────────────────────────
      # Copy environment.properties BEFORE clean
      # ─────────────────────────────────────────────
      - name: Prepare Allure results directory
        run: |
          mkdir -p target/allure-results
          cp /tmp/allure-env/environment.properties target/allure-results/
          echo "Copied environment.properties to target/allure-results"

      # ─────────────────────────────────────────────
      # Run Kafka tests - ВСЕГДА В 1 ПОТОК
      # ─────────────────────────────────────────────
      - name: Run Kafka tests
        env:
          KAFKA_BOOTSTRAP_SERVERS: ${{ secrets.KAFKA_BOOTSTRAP_SERVERS }}
          KAFKA_SSL_TRUSTSTORE_PASSWORD: ${{ secrets.KAFKA_SSL_TRUSTSTORE_PASSWORD }}
          KAFKA_SSL_KEYSTORE_PASSWORD: ${{ secrets.KAFKA_SSL_KEYSTORE_PASSWORD }}
          KAFKA_REST_API_PASSWORD: ${{ secrets.KAFKA_REST_API_PASSWORD }}
          KAFKA_SCHEMA_REGISTRY_PASSWORD: ${{ secrets.KAFKA_SCHEMA_REGISTRY_PASSWORD }}
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "   Test Execution Configuration"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Event type: ${{ github.event_name }}"
          echo "Threads: 1 (FORCED)"
          echo "Parallel profile: ${{ env.USE_PARALLEL_PROFILE }}"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          
          # Строим Maven команду
          MVN_CMD="mvn clean test -Denv=ci -Dthread.count=1"
          
          # Добавляем parallel профиль только если явно запрошено
          if [ "${{ env.USE_PARALLEL_PROFILE }}" = "true" ]; then
            MVN_CMD="$MVN_CMD -Pparallel"
            echo "  Parallel execution ENABLED (but with thread.count=1)"
          else
            echo "  Sequential execution (no parallel profile)"
          fi
          
          # Добавляем остальные параметры
          MVN_CMD="$MVN_CMD \
            -Dkafka.bootstrap.servers=$KAFKA_BOOTSTRAP_SERVERS \
            -Dkafka.ssl.truststore.location=${{ env.KAFKA_SSL_TRUSTSTORE_LOCATION }} \
            -Dkafka.ssl.keystore.location=${{ env.KAFKA_SSL_KEYSTORE_LOCATION }} \
            -Dkafka.ssl.truststore.password=${{ secrets.KAFKA_SSL_TRUSTSTORE_PASSWORD }} \
            -Dkafka.ssl.keystore.password=${{ secrets.KAFKA_SSL_KEYSTORE_PASSWORD }} \
            -Dallure.results.directory=target/allure-results"
          
          echo "Executing: $MVN_CMD"
          echo ""
          
          # Выполняем команду
          eval $MVN_CMD

      # ─────────────────────────────────────────────
      # Restore environment.properties AFTER clean
      # ─────────────────────────────────────────────
      - name: Restore environment.properties after clean
        if: always()
        run: |
          if [ ! -f target/allure-results/environment.properties ]; then
            cp /tmp/allure-env/environment.properties target/allure-results/
            echo "Restored environment.properties after mvn clean"
          else
            echo "environment.properties already exists"
          fi

      # ─────────────────────────────────────────────
      # Create Allure executor.json AFTER tests
      # ─────────────────────────────────────────────
      - name: Create Allure executor info
        if: always()
        run: |
          cat > target/allure-results/executor.json << EOF
          {
            "name": "GitHub Actions",
            "type": "github",
            "buildName": "${{ github.workflow }} #${{ github.run_number }}",
            "buildUrl": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "buildOrder": ${{ github.run_number }},
            "reportUrl": "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          }
          EOF

      # ─────────────────────────────────────────────
      # Restore Allure history before report generation
      # ─────────────────────────────────────────────
      - name: Restore Allure history
        if: always()
        run: |
          mkdir -p target/allure-results/history
          if [ -d /tmp/allure-history ] && [ "$(ls -A /tmp/allure-history 2>/dev/null)" ]; then
            cp -r /tmp/allure-history/* target/allure-results/history/
            echo "Restored $(ls -1 target/allure-results/history 2>/dev/null | wc -l) history files"
          else
            echo "No history to restore"
          fi

      # ─────────────────────────────────────────────
      # Verify environment.properties exists
      # ─────────────────────────────────────────────
      - name: Verify Allure files
        if: always()
        run: |
          echo "Files in target/allure-results:"
          ls -lah target/allure-results/ | grep -E "environment|executor" || echo "Missing files!"
          if [ -f target/allure-results/environment.properties ]; then
            echo ""
            echo "environment.properties content:"
            cat target/allure-results/environment.properties
          fi

      # ─────────────────────────────────────────────
      # Generate Allure report
      # ─────────────────────────────────────────────
      - name: Generate Allure Report
        if: always()
        run: mvn allure:report

      # ─────────────────────────────────────────────
      # Deploy Allure report to gh-pages
      # ─────────────────────────────────────────────
      - name: Deploy Allure report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: target/allure-report
          keep_files: false
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'

      - name: Report deployment info
        if: always()
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "   Allure Report Deployment"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "   Report URL:"
          echo "   https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          echo ""
          echo "   Note: GitHub Pages deployment may take 5-10 minutes"
          echo ""
          echo "   Check deployment status:"
          echo "   https://github.com/${{ github.repository }}/deployments"
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      # ─────────────────────────────────────────────
      # Upload artifacts
      # ─────────────────────────────────────────────
      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-all-tests
          path: target/allure-results
          retention-days: 30

      - name: Upload Allure Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-all-tests
          path: target/site/allure-maven-plugin
          retention-days: 30

      - name: Upload Test Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-all-tests
          path: target/logs/
          retention-days: 7

      - name: Publish Test Results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: target/surefire-reports/*.xml
          check_name: Test Results - All Kafka Tests
