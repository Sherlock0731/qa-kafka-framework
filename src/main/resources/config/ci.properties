# CI Environment Configuration

env=ci

# SSL paths will be provided by GitHub Actions secrets
# kafka.ssl.truststore.location will be set from KAFKA_TRUSTSTORE_PATH
# kafka.ssl.keystore.location will be set from KAFKA_KEYSTORE_PATH

# Passwords from secrets
# kafka.ssl.truststore.password from KAFKA_TRUSTSTORE_PASSWORD
# kafka.ssl.keystore.password from KAFKA_KEYSTORE_PASSWORD
# kafka.rest.api.password from KAFKA_REST_API_PASSWORD
# kafka.schema.registry.password from KAFKA_SCHEMA_REGISTRY_PASSWORD

# Aiven API Configuration from secrets
# aiven.api.token from AIVEN_API_TOKEN
# aiven.project.name from AIVEN_PROJECT_NAME
# aiven.service.name from AIVEN_SERVICE_NAME

# CI-specific settings
test.cleanup.topics=true
logging.detailed=false
