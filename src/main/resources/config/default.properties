# Default Configuration for Kafka Test Framework

# Environment
env=local

# Kafka Connection
kafka.bootstrap.servers=
kafka.security.protocol=SSL

# SSL Configuration (will be overridden in local.properties)
kafka.ssl.truststore.location=
kafka.ssl.truststore.password=
kafka.ssl.keystore.location=
kafka.ssl.keystore.password=
kafka.ssl.key.password=

# Kafka REST API
kafka.rest.api.url=
kafka.rest.api.username=
kafka.rest.api.password=

# Schema Registry
kafka.schema.registry.url=
kafka.schema.registry.username=
kafka.schema.registry.password=

# Producer Configuration
kafka.producer.acks=all
kafka.producer.retries=3
kafka.producer.enable.idempotence=true
kafka.producer.max.in.flight.requests.per.connection=5
kafka.producer.batch.size=16384
kafka.producer.linger.ms=10
kafka.producer.request.timeout.ms=30000

# Consumer Configuration
kafka.consumer.group.id.base=qa-test-group
kafka.consumer.auto.offset.reset=earliest
kafka.consumer.enable.auto.commit=false
kafka.consumer.auto.commit.interval.ms=5000
kafka.consumer.session.timeout.ms=30000
kafka.consumer.max.poll.interval.ms=300000
kafka.consumer.max.poll.records=500
kafka.consumer.fetch.min.bytes=1
kafka.consumer.fetch.max.wait.ms=500

# Test Configuration
kafka.test.topic.prefix=qa-test
kafka.test.topic.partitions=1
kafka.test.topic.replication.factor=1
kafka.test.dlq.suffix=-dlq

# Test Timeouts
test.timeout.seconds=30
test.poll.timeout.seconds=5

# Parallel Execution
thread.count=1

# Logging
logging.detailed=true

# Cleanup
# Per-test cleanup via KafkaAdminClient (@AfterEach in BaseTest)
test.cleanup.topics=true
# Global end-of-suite cleanup via Aiven REST API (GlobalCleanupListener)
# Disable when running against local Kafka (no Aiven API) or to inspect topics post-run
test.cleanup.aiven.api.enabled=true

# Aiven API Configuration
aiven.api.url=https://api.aiven.io/v1
aiven.api.token=
aiven.project.name=
aiven.service.name=
